version: '3.9'
services:
  postgres:
    container_name: CarDb
    image: postgres:latest
    environment:
      POSTGRES_DB: "CarDb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

volumes:
  postgres-data:
      